# DO App Platform spec — declarative deploy for both the SPA and the
# Gemini-proxy function from a single git push.
#
# Adopt with:
#   doctl apps create --spec .do/app.yaml         # first time
#   doctl apps update <app-id> --spec .do/app.yaml  # after edits
#
# Or paste the contents into Settings → App Spec in the DO dashboard.
#
# Required env:
#   GEMINI_API_KEY (encrypted secret on the `api` function component)

name: coif
region: nyc

static_sites:
  - name: web
    github:
      repo: bustamonica/dog_haircut
      branch: claude/dog-grooming-visualizer-w3wtr
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    output_dir: dist
    catchall_document: index.html
    routes:
      - path: /

functions:
  - name: api
    github:
      repo: bustamonica/dog_haircut
      branch: claude/dog-grooming-visualizer-w3wtr
      deploy_on_push: true
    source_dir: /functions
    routes:
      - path: /api
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
